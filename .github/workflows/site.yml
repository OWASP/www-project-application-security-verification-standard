name: Build and deploy website

on:
  push:
    branches: [master, 'site/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test deployment-path regression checks
        run: python3 -m unittest discover -s scripts -p test_check_site.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build 2>&1 | tee /tmp/asvs-build.log
          python3 -c "from pathlib import Path; assert 'Deprecation Warning' not in Path('/tmp/asvs-build.log').read_text(), 'Sass deprecations returned'"
      - name: Validate generated website
        run: python3 scripts/check_site.py _site --baseurl ""
      - name: Build and validate project-path compatibility
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --baseurl "/${{ github.event.repository.name }}" --destination /tmp/asvs-site-project 2>&1 | tee /tmp/asvs-root-build.log
          python3 -c "from pathlib import Path; assert 'Deprecation Warning' not in Path('/tmp/asvs-root-build.log').read_text(), 'Sass deprecations returned'"
          python3 scripts/check_site.py /tmp/asvs-site-project --baseurl "/${{ github.event.repository.name }}"
      - name: Install browser test driver
        run: python3 -m pip install playwright
      - name: Review desktop, mobile, and search in Chrome
        run: python3 scripts/review_site.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asvs-browser-review
          path: /tmp/asvs-review
          retention-days: 7
      - name: Upload built website for preview
        uses: actions/upload-artifact@v4
        with:
          name: asvs-site-preview
          path: _site
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: _site

  windows:
    name: Windows Ruby 4.0.7 launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: false
      - name: Test first-run dependency installation and batch launcher
        shell: python
        run: |
          import subprocess, time, urllib.request
          from pathlib import Path
          with open('launcher.log', 'w') as log:
              process = subprocess.Popen(['cmd', '/c', 'start-site.bat'], stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT)
              try:
                  for _ in range(600):
                      if process.poll() is not None:
                          raise RuntimeError(Path('launcher.log').read_text())
                      try:
                          with urllib.request.urlopen('http://127.0.0.1:4000/', timeout=2) as response:
                              assert 'OWASP Application Security Verification Standard' in response.read().decode()
                              print('Windows batch launcher served the ASVS overview successfully.')
                              break
                      except OSError:
                          time.sleep(1)
                  else:
                      raise TimeoutError(Path('launcher.log').read_text())
              finally:
                  subprocess.run(['taskkill', '/F', '/T', '/PID', str(process.pid)], check=False)
                  print(Path('launcher.log').read_text())

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
