name: Build and deploy website

on:
  push:
    branches: [master, site/just-the-docs-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "/${{ github.event.repository.name }}"
      - name: Validate generated website
        run: python3 scripts/check_site.py _site
      - name: Build and validate domain-root URLs
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --baseurl "" --destination /tmp/asvs-site-root
          python3 scripts/check_site.py /tmp/asvs-site-root
      - name: Install browser test driver
        run: python3 -m pip install playwright
      - name: Review desktop, mobile, and search in Chrome
        run: python3 scripts/review_site.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asvs-browser-review
          path: /tmp/asvs-review
          retention-days: 7
      - name: Upload built website for preview
        uses: actions/upload-artifact@v4
        with:
          name: asvs-site-preview
          path: _site
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
